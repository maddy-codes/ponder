[project]
name = "ponder"
version = "0.1.0"
description = "An agent that decides how hard to think: difficulty x stakes -> compute budget."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-ai-slim[openai]>=0.0.30",
    "logfire>=2.0",
    "modal>=0.64",
    "convex>=0.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.7",
    "pydantic-ai-harness>=0.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
